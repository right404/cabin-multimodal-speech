[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cabin-multimodal-speech"
version = "0.1.0"
description = "Audio-visual target-speaker selection and multichannel array beamforming."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "opencc-python-reimplemented>=0.1.7",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "soundfile>=0.13",
]

[project.optional-dependencies]
demo = [
  "gradio>=5,<6",
  "opencv-python>=4.10,<5",
  "Pillow>=10",
  "sounddevice>=0.5",
]
asr = [
  "torch>=2.5",
  "transformers>=4.48,<5",
]
evaluation = [
  "opencv-python>=4.10,<5",
  "python_speech_features>=0.6",
  "torch>=2.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
cabin-speech = "cabin_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
